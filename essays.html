/* ===== Theme tokens — swap here. Set data-theme="light" on <html> for the light theme. ===== */
:root{

  --overlay-opacity:.07;

  --font-title:"Orbitron","Oswald",system-ui,sans-serif;

  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;

}
[data-theme="light"]{
  --bg:#f5f4fa; --bg-alt:#ebe9f3; --surface:#ffffff; --line:#d6d3e3;
  --text:#14121f; --muted:#4d4a5e;
  --accent:#b0008f; --accent-2:#006b80; --accent-ink:#ffffff;
  --glow-a:none; --glow-b:none;
  --sky:linear-gradient(180deg,#f5f4fa 0%,#e8e4f6 70%,#f3dff0 100%);
  --skyline:#2a2540; --window:#f5f4fa;
  --overlay-opacity:0;
  --ph-bg:rgba(0,107,128,.06); --ph-line:rgba(0,107,128,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.7 var(--font-body);-webkit-font-smoothing:antialiased;position:relative}
/* scanline + grain overlay */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:var(--overlay-opacity);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 1px,transparent 1px 3px),

a{color:var(--accent-2);text-underline-offset:.2em}

.skip:focus{left:1rem;top:1rem}
.wrap{max-width:var(--max);margin:0 auto;padding:0 1.5rem;position:relative}
.kicker{font:500 .8rem/1 var(--font-display);letter-spacing:.3em;text-transform:uppercase;color:var(--accent-2);margin:0 0 .9rem}

/* header */
.site-head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:3.75rem;gap:1rem;min-width:0}
.brand{display:flex;align-items:center;flex:0 1 auto;min-width:0;line-height:0;text-decoration:none}
.brand img{display:block;height:auto;width:auto;max-height:2.5rem;max-width:min(11.25rem,42vw)}
.site-head nav{flex:0 0 auto}
.site-head nav ul{display:flex;gap:1.4rem;list-style:none;margin:0;padding:0}
.site-head nav a{color:var(--muted);text-decoration:none;font:500 .82rem/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.site-head nav a:hover,.site-head nav a[aria-current="page"]{color:var(--accent-2)}
@media (max-width:900px){.site-head nav ul{gap:.85rem} .site-head nav a{letter-spacing:.08em}}

  .site-head nav a{letter-spacing:.04em}
}

.essays{padding:clamp(3.5rem,8vw,6rem) 0 clamp(4.5rem,10vw,7rem);border-bottom:1px solid var(--line)}
.essay-col{max-width:40rem}

.essay-list{list-style:none;margin:2.1rem 0 0;padding:0;display:flex;flex-direction:column;gap:.8rem}
.essay-list a{display:block;padding:1.15rem 1.25rem;border:1px solid var(--line);border-left:2px solid var(--accent-2);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:inherit}

.essay-list h2{font:500 1.2rem/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 .4rem;color:var(--text)}
.essay-list p{margin:0;color:var(--muted);font-size:1rem;line-height:1.5}

footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
footer a{color:var(--muted)}
